# Virtual workspace root: not a package. Every example and spike is a member.
[project]
name = "design-patterns-with-python-workspace"
version = "0.0.0"
requires-python = ">=3.15"
dependencies = []

[tool.uv]
package = false
# One set of pins for every member: `uv run` from a member directory picks these up.
default-groups = ["dev"]

[tool.uv.workspace]
members = ["examples/*", "spikes/*"]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-mock==3.17.0",
    "ruff==0.17.4",
    "mypy==2.4.1",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib --strict-markers --strict-config"
testpaths = ["examples", "spikes"]
xfail_strict = true
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py315"
extend-exclude = ["_site", ".jekyll-cache", "vendor", ".bundle", ".venv-ft", "scripts/host_ids.py", "scripts/generate_diagram.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PT", "N"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.15"
strict = true
warn_unreachable = true
warn_redundant_casts = true

# Vendored, unchanged from lgtm-skills: keep its errors out of strict runs.
[[tool.mypy.overrides]]
module = ["generate_diagram", "host_ids"]
ignore_errors = true
