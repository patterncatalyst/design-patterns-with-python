<text x="500.0" y="582.5" font-size="11.5" fill="#555555" text-anchor="middle">an argument: the signature</text>
<text x="500.0" y="597.5" font-size="11.5" fill="#555555" text-anchor="middle">misleads; use partial</text>
<rect x="340" y="770" width="320" height="60" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="500.0" y="798.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">document_kind</text>
<text x="500.0" y="815.0" font-size="11.5" fill="#555555" text-anchor="middle">above: registers the class the name holds</text>
<rect x="340" y="880" width="320" height="60" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
