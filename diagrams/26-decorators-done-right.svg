<text x="210.0" y="705.0" font-size="11.5" fill="#555555" text-anchor="middle">follows __wrapped__</text>
<rect x="640" y="530" width="300" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
