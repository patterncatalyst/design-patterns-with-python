<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="60" y="270" width="340" height="240" rx="12" fill="#f4f4f4" stroke="#ddd"/>
<text x="72" y="290" font-size="12" font-weight="700" fill="#888">Tax</text>
<rect x="85" y="310" width="290" height="170" rx="12" fill="#ececec" stroke="#ddd"/>
<text x="97" y="330" font-size="12" font-weight="700" fill="#888">Surcharge</text>
<rect x="40" y="50" width="380" height="70" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="230.0" y="83.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">layers_for(consignment)</text>
<text x="230.0" y="100.0" font-size="11.5" fill="#555555" text-anchor="middle">chooses the layers for this consignment</text>
<rect x="40" y="160" width="380" height="70" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="230.0" y="193.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">compose(base, layers)</text>
<text x="230.0" y="210.0" font-size="11.5" fill="#555555" text-anchor="middle">the last layer ends up outermost</text>
<rect x="115" y="360" width="230" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="230.0" y="393.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">BaseRate</text>
<text x="230.0" y="410.0" font-size="11.5" fill="#555555" text-anchor="middle">innermost: the base price</text>
<rect x="580" y="50" width="380" height="70" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="770.0" y="83.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">@retry(attempts=..., on=...)</text>
<text x="770.0" y="100.0" font-size="11.5" fill="#555555" text-anchor="middle">a factory returns what @ applies</text>
<rect x="580" y="160" width="380" height="70" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="770.0" y="193.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">def quote_carrier</text>
<text x="770.0" y="210.0" font-size="11.5" fill="#555555" text-anchor="middle">the function the line above wraps</text>
<rect x="580" y="270" width="380" height="70" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="770.0" y="303.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">quote_carrier</text>
<text x="770.0" y="320.0" font-size="11.5" fill="#555555" text-anchor="middle">name rebound once, when the module loads</text>
<rect x="440" y="160" width="120" height="70" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="500.0" y="185.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">same word,</text>
<text x="500.0" y="202.5" font-size="11.5" fill="#555555" text-anchor="middle">unrelated</text>
<text x="500.0" y="217.5" font-size="11.5" fill="#555555" text-anchor="middle">mechanisms</text>
<rect x="40" y="590" width="520" height="70" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="300.0" y="623.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">CarrierGatewayProxy</text>
<text x="300.0" y="640.0" font-size="11.5" fill="#555555" text-anchor="middle">Proxy: same interface, controls access (caches quote)</text>
<rect x="620" y="590" width="340" height="70" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="790.0" y="623.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">forwarding with __getattr__</text>
<text x="790.0" y="640.0" font-size="11.5" fill="#555555" text-anchor="middle">mypy sees Any</text>
