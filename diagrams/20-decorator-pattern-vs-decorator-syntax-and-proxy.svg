<path d="M230,230 L230,270" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M770,120 L770,160" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M770,230 L770,270" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="40" y="32" font-size="13" fill="#111111" text-anchor="start" font-weight="700">Decorator pattern: while the program runs</text>
<text x="580" y="32" font-size="13" fill="#111111" text-anchor="start" font-weight="700">@decorator syntax: at definition time</text>
<text x="230" y="540" font-size="12" fill="#555555" text-anchor="middle">a value: chosen per consignment</text>
</svg>