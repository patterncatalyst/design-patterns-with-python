<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="230" y="30" width="360" height="56" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="410.0" y="56.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">A request names a pattern</text>
<text x="410.0" y="73.0" font-size="11.5" fill="#555555" text-anchor="middle">add a pricing rule to the rate quote</text>
<rect x="20" y="140" width="370" height="56" rx="9" fill="#f4f4f4" stroke="#888888" stroke-width="1.5"/>
<text x="205.0" y="166.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Names only the pattern</text>
<text x="205.0" y="183.0" font-size="11.5" fill="#555555" text-anchor="middle">the label says nothing about the mechanism</text>
<rect x="430" y="140" width="370" height="56" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="615.0" y="166.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Names the role and the mechanism</text>
<text x="615.0" y="183.0" font-size="11.5" fill="#555555" text-anchor="middle">the label points at the idiom</text>
<rect x="20" y="250" width="370" height="56" rx="9" fill="#f4f4f4" stroke="#888888" stroke-width="1.5"/>
<text x="205.0" y="276.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">RateStrategy</text>
<text x="205.0" y="293.0" font-size="11.5" fill="#555555" text-anchor="middle">a class suffix that suggests a subclass per rule</text>
<rect x="430" y="250" width="180" height="56" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="520.0" y="276.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">PricingRule</text>
<text x="520.0" y="293.0" font-size="11.5" fill="#555555" text-anchor="middle">a callable type alias</text>
<rect x="620" y="250" width="180" height="56" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="710.0" y="276.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">per_kg</text>
<text x="710.0" y="293.0" font-size="11.5" fill="#555555" text-anchor="middle">a function that fits it</text>
<rect x="20" y="360" width="370" height="56" rx="9" fill="#f4f4f4" stroke="#888888" stroke-width="1.5"/>
<text x="205.0" y="386.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Read as a class hierarchy</text>
<text x="205.0" y="403.0" font-size="11.5" fill="#555555" text-anchor="middle">the reviewer expects the 1994 structure</text>
<rect x="430" y="360" width="370" height="56" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="615.0" y="386.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Read as a callable</text>
<text x="615.0" y="403.0" font-size="11.5" fill="#555555" text-anchor="middle">the reviewer checks signature and types</text>
<rect x="230" y="470" width="360" height="56" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="410.0" y="496.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Reviewer and assistant check the same contract</text>
<text x="410.0" y="513.0" font-size="11.5" fill="#555555" text-anchor="middle">one name, one claim to verify</text>
<path d="M330,86 L205,140" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M490,86 L615,140" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M205,196 L205,250" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M520,196 L520,250" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M710,196 L710,250" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M205,306 L205,360" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M520,306 L560,360" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M710,306 L670,360" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M205,416 L330,470" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M615,416 L490,470" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
</svg>