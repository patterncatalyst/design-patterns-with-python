<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="300" y="40" width="400" height="70" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="500.0" y="73.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Signal.publish(event)</text>
<text x="500.0" y="90.0" font-size="11.5" fill="#555555" text-anchor="middle">queued: nested events wait their turn</text>
<rect x="300" y="160" width="400" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="500.0" y="193.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">subscribers</text>
<text x="500.0" y="210.0" font-size="11.5" fill="#555555" text-anchor="middle">a snapshot, in subscription order</text>
<rect x="70" y="300" width="260" height="70" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="200.0" y="333.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">TrackingHistory.record</text>
<text x="200.0" y="350.0" font-size="11.5" fill="#555555" text-anchor="middle">bound method: held through WeakMethod</text>
<rect x="370" y="300" width="260" height="70" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="500.0" y="333.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">lambda</text>
<text x="500.0" y="350.0" font-size="11.5" fill="#555555" text-anchor="middle">held strongly</text>
<rect x="670" y="300" width="260" height="70" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="800.0" y="333.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">a failing subscriber</text>
<text x="800.0" y="350.0" font-size="11.5" fill="#555555" text-anchor="middle">error collected, delivery continues</text>
<rect x="330" y="450" width="340" height="70" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="500.0" y="483.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">ExceptionGroup</text>
<text x="500.0" y="500.0" font-size="11.5" fill="#555555" text-anchor="middle">raised after every subscriber has run</text>
<rect x="280" y="600" width="440" height="70" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="500.0" y="633.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">plain list</text>
<text x="500.0" y="650.0" font-size="11.5" fill="#555555" text-anchor="middle">stops at a failure, keeps every subscriber alive</text>
