<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 480" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="30" y="30" width="340" height="50" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="200.0" y="60.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">issue(kind, consignment_id)</text>
<rect x="30" y="140" width="340" height="80" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="200.0" y="170.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">issuers[kind]</text>
<text x="200.0" y="187.5" font-size="11.5" fill="#555555" text-anchor="middle">one lookup inside the try</text>
<text x="200.0" y="202.5" font-size="11.5" fill="#555555" text-anchor="middle">KeyError becomes UnsupportedDocumentError</text>
<rect x="410" y="145" width="230" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="525.0" y="170.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">ISSUERS</text>
<text x="525.0" y="187.5" font-size="11.5" fill="#555555" text-anchor="middle">frozendict, read-only</text>
<text x="525.0" y="202.5" font-size="11.5" fill="#555555" text-anchor="middle">a test walks every DocumentKind</text>
<rect x="30" y="280" width="340" height="60" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="200.0" y="308.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">issuer(consignment_id)</text>
<text x="200.0" y="325.0" font-size="11.5" fill="#555555" text-anchor="middle">outside the try: its own errors pass through</text>
<rect x="30" y="400" width="340" height="50" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="200.0" y="430.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">reference</text>
<rect x="650" y="30" width="280" height="50" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="790.0" y="53.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">_LookFirstDutyRateCache.rate_for</text>
<text x="790.0" y="70.0" font-size="11.5" fill="#555555" text-anchor="middle">the comparison form</text>
<rect x="950" y="30" width="250" height="50" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="1075.0" y="60.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">DutyRateCache.rate_for(hs_code)</text>
<rect x="650" y="150" width="280" height="80" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="790.0" y="180.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">look first: in, then read</text>
<text x="790.0" y="197.5" font-size="11.5" fill="#555555" text-anchor="middle">an eviction in the gap</text>
<text x="790.0" y="212.5" font-size="11.5" fill="#555555" text-anchor="middle">raises KeyError</text>
<rect x="950" y="150" width="250" height="80" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="1075.0" y="180.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">ask forgiveness: read once</text>
<text x="1075.0" y="197.5" font-size="11.5" fill="#555555" text-anchor="middle">on KeyError, load</text>
<text x="1075.0" y="212.5" font-size="11.5" fill="#555555" text-anchor="middle">and store the rate</text>
