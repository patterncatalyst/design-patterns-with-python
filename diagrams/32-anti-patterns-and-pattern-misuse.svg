<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 860" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="40" y="30" width="310" height="110" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="195.0" y="68.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">quote(consignment, tariff)</text>
<text x="195.0" y="85.0" font-size="11.5" fill="#555555" text-anchor="middle">flat fee, fuel surcharge and tax</text>
<text x="195.0" y="100.0" font-size="11.5" fill="#555555" text-anchor="middle">in one definition</text>
<text x="195.0" y="115.0" font-size="11.5" fill="#555555" text-anchor="middle">0 classes, 1 function, 8 lines, 1 call</text>
<rect x="40" y="660" width="310" height="60" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="195.0" y="695.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">RateQuote</text>
<rect x="430" y="30" width="340" height="60" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="600.0" y="58.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">_PricingStrategyFactory</text>
<text x="600.0" y="75.0" font-size="11.5" fill="#555555" text-anchor="middle">create builds the strategy for the engine</text>
<rect x="430" y="135" width="340" height="60" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="600.0" y="163.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">_RateEngine.quote</text>
<text x="600.0" y="180.0" font-size="11.5" fill="#555555" text-anchor="middle">9 classes, 17 functions, 57 lines, 11 calls</text>
<rect x="430" y="240" width="340" height="60" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="600.0" y="268.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">_FlatFeeStrategy.charges</text>
<text x="600.0" y="285.0" font-size="11.5" fill="#555555" text-anchor="middle">returns the flat fee and fuel charge objects</text>
<rect x="430" y="345" width="340" height="60" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="600.0" y="373.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">_FlatFeeCharge and _FuelSurcharge</text>
<text x="600.0" y="390.0" font-size="11.5" fill="#555555" text-anchor="middle">one object for each charge</text>
<rect x="430" y="450" width="340" height="60" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="600.0" y="478.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">accept</text>
<text x="600.0" y="495.0" font-size="11.5" fill="#555555" text-anchor="middle">each charge calls back into the visitor</text>
<rect x="430" y="555" width="340" height="60" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="600.0" y="583.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">_NetTotalVisitor.visit_flat_fee</text>
<text x="600.0" y="600.0" font-size="11.5" fill="#555555" text-anchor="middle">and visit_fuel add each amount to the total</text>
<rect x="430" y="660" width="340" height="60" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="600.0" y="695.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">RateQuote</text>
<rect x="830" y="540" width="220" height="90" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="940.0" y="575.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">a new charge kind:</text>
<text x="940.0" y="592.5" font-size="11.5" fill="#555555" text-anchor="middle">a new class and a visit method</text>
<text x="940.0" y="607.5" font-size="11.5" fill="#555555" text-anchor="middle">the visitor does not yet have</text>
<rect x="40" y="770" width="1000" height="50" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="540.0" y="800.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">same table of quotes; mypy and ruff pass both</text>
