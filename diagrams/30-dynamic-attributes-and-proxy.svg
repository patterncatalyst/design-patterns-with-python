<rect x="40" y="830" width="360" height="60" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="220.0" y="858.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">value</text>
<text x="220.0" y="875.0" font-size="11.5" fill="#555555" text-anchor="middle">later reads find it in the instance dict</text>
<rect x="600" y="470" width="360" height="60" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="780.0" y="498.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">any other name</text>
