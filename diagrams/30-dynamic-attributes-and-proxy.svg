<text x="780.0" y="650.0" font-size="11.5" fill="#555555" text-anchor="middle">built from __dir__</text>
<rect x="600" y="730" width="360" height="75" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
