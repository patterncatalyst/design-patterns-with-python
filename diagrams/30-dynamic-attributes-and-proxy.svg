<rect x="600" y="850" width="360" height="75" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="780.0" y="885.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">a __getattr__ that reads a missing attribute</text>
<text x="780.0" y="902.5" font-size="11.5" fill="#555555" text-anchor="middle">recurses when copy builds an instance</text>
