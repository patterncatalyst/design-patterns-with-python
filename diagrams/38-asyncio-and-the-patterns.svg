<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="40" y="30" width="400" height="70" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="240.0" y="63.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">carrier_session</text>
<text x="240.0" y="80.0" font-size="11.5" fill="#555555" text-anchor="middle">open the feed; close it when the body ends</text>
<rect x="40" y="160" width="400" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="240.0" y="193.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">handling_events</text>
<text x="240.0" y="210.0" font-size="11.5" fill="#555555" text-anchor="middle">an async generator over the feed</text>
<rect x="40" y="290" width="400" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="240.0" y="323.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">AsyncSignal.publish</text>
<text x="240.0" y="340.0" font-size="11.5" fill="#555555" text-anchor="middle">gather runs the subscribers; failures raise as a group</text>
<rect x="40" y="420" width="400" height="70" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="240.0" y="453.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">_TaskGroupSignal</text>
<text x="240.0" y="470.0" font-size="11.5" fill="#555555" text-anchor="middle">one failing subscriber cancels the rest</text>
<rect x="540" y="160" width="400" height="80" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="740.0" y="190.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">cheapest</text>
<text x="740.0" y="207.5" font-size="11.5" fill="#555555" text-anchor="middle">TaskGroup over RateSource</text>
<text x="740.0" y="222.5" font-size="11.5" fill="#555555" text-anchor="middle">AircoSource runs the SDK in a thread</text>
<rect x="540" y="330" width="400" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="740.0" y="363.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">run_commands</text>
<text x="740.0" y="380.0" font-size="11.5" fill="#555555" text-anchor="middle">a Queue until shutdown</text>
<rect x="40" y="550" width="900" height="60" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="490.0" y="578.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">an await is where another task can run</text>
<text x="490.0" y="595.0" font-size="11.5" fill="#555555" text-anchor="middle">cancellation still closes the feed</text>
<path d="M240,360 L240,420" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
</svg>