<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="40" y="30" width="440" height="70" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="260.0" y="63.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">tariff_table</text>
<text x="260.0" y="80.0" font-size="11.5" fill="#555555" text-anchor="middle">module: built at import time</text>
<rect x="40" y="150" width="440" height="70" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="260.0" y="183.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">lazy from ... import tariff_table</text>
<text x="260.0" y="200.0" font-size="11.5" fill="#555555" text-anchor="middle">built on first use, once</text>
<rect x="40" y="270" width="440" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="260.0" y="303.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">quote(..., table=...)</text>
<text x="260.0" y="320.0" font-size="11.5" fill="#555555" text-anchor="middle">passed in: tests and tenants get their own</text>
<rect x="40" y="390" width="440" height="70" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="260.0" y="415.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">LoadOnce</text>
<text x="260.0" y="432.5" font-size="11.5" fill="#555555" text-anchor="middle">lock with a double check:</text>
<text x="260.0" y="447.5" font-size="11.5" fill="#555555" text-anchor="middle">load needs run-time input</text>
<rect x="620" y="150" width="300" height="70" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="770.0" y="183.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Borg</text>
<text x="770.0" y="200.0" font-size="11.5" fill="#555555" text-anchor="middle">shared state, distinct objects</text>
<rect x="620" y="270" width="300" height="70" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="770.0" y="303.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">SingletonMeta</text>
<text x="770.0" y="320.0" font-size="11.5" fill="#555555" text-anchor="middle">second call&#x27;s arguments ignored</text>
<rect x="620" y="390" width="300" height="70" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="770.0" y="423.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">__new__</text>
<text x="770.0" y="440.0" font-size="11.5" fill="#555555" text-anchor="middle">reruns __init__</text>
<rect x="40" y="540" width="440" height="70" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="260.0" y="573.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">functools.cache memoises;</text>
<text x="260.0" y="590.0" font-size="11.5" fill="#555555" text-anchor="middle">it is not call-once</text>
<path d="M260,100 L260,150" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M260,220 L260,270" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M260,340 L260,390" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M260,460 L260,540" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
</svg>