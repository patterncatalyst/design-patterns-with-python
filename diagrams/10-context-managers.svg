<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 600" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="230" y="30" width="360" height="56" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="410.0" y="56.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">with ManifestWriter(path) as out:</text>
<text x="410.0" y="73.0" font-size="11.5" fill="#555555" text-anchor="middle">the block begins</text>
<rect x="230" y="130" width="360" height="56" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="410.0" y="156.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">__enter__</text>
<text x="410.0" y="173.0" font-size="11.5" fill="#555555" text-anchor="middle">opens path.partial</text>
<rect x="230" y="230" width="360" height="56" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="410.0" y="256.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">body writes lines</text>
<text x="410.0" y="273.0" font-size="11.5" fill="#555555" text-anchor="middle">to the partial file</text>
<rect x="20" y="360" width="360" height="76" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="200.0" y="388.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">body returns</text>
<text x="200.0" y="405.5" font-size="11.5" fill="#555555" text-anchor="middle">__exit__(None, None, None)</text>
<text x="200.0" y="420.5" font-size="11.5" fill="#555555" text-anchor="middle">close, replace partial with path</text>
<rect x="440" y="360" width="360" height="76" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="620.0" y="388.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">body raises</text>
<text x="620.0" y="405.5" font-size="11.5" fill="#555555" text-anchor="middle">__exit__(exc_type, exc, traceback)</text>
<text x="620.0" y="420.5" font-size="11.5" fill="#555555" text-anchor="middle">close, unlink partial, return None</text>
<rect x="20" y="490" width="360" height="56" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="200.0" y="516.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">manifest committed</text>
<text x="200.0" y="533.0" font-size="11.5" fill="#555555" text-anchor="middle">readers see the complete file</text>
<rect x="440" y="490" width="360" height="56" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="620.0" y="516.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">exception propagates</text>
<text x="620.0" y="533.0" font-size="11.5" fill="#555555" text-anchor="middle">no partial file is left behind</text>
<path d="M410,86 L410,130" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M410,186 L410,230" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M410,286 L200,360" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M410,286 L620,360" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M200,436 L200,490" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M620,436 L620,490" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
</svg>