<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="230" y="30" width="400" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="430.0" y="63.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">StowagePlan.reserve</text>
<text x="430.0" y="80.0" font-size="11.5" fill="#555555" text-anchor="middle">pick slot, gap, store</text>
<rect x="40" y="180" width="360" height="80" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="220.0" y="218.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">no lock: nullcontext</text>
<text x="220.0" y="235.0" font-size="11.5" fill="#555555" text-anchor="middle">two threads meet in the gap (Barrier)</text>
<rect x="460" y="180" width="360" height="80" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="640.0" y="218.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Lock over the read and the write</text>
<text x="640.0" y="235.0" font-size="11.5" fill="#555555" text-anchor="middle">_RecordingLock: the second caller waits</text>
<rect x="40" y="330" width="360" height="80" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="220.0" y="368.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">the two threads take the same SlotId</text>
<text x="220.0" y="385.0" font-size="11.5" fill="#555555" text-anchor="middle">on either build; one reservation is left</text>
<rect x="460" y="330" width="360" height="80" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="640.0" y="368.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">each thread gets its own SlotId</text>
<text x="640.0" y="385.0" font-size="11.5" fill="#555555" text-anchor="middle">two reservations are stored</text>
<rect x="40" y="470" width="780" height="60" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="430.0" y="498.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">a lock that covers the read and the write keeps the pair together</text>
<text x="430.0" y="515.0" font-size="11.5" fill="#555555" text-anchor="middle">the GIL does not join them</text>
<path d="M330,100 L220,180" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M530,100 L640,180" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M220,260 L220,330" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M640,260 L640,330" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M220,410 L220,470" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M640,410 L640,470" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
</svg>