<rect x="470" y="242" width="330" height="60" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="635.0" y="270.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">pages</text>
