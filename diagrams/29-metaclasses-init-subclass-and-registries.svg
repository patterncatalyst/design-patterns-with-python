<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1060" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="130" y="30" width="400" height="60" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="330.0" y="58.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">a class statement</text>
<text x="330.0" y="75.0" font-size="11.5" fill="#555555" text-anchor="middle">e.g. class FastlineGateway(CarrierBase, code=&quot;FASTLINE&quot;)</text>
<rect x="130" y="150" width="400" height="60" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="330.0" y="178.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">__prepare__</text>
<text x="330.0" y="195.0" font-size="11.5" fill="#555555" text-anchor="middle">a metaclass can supply the class namespace</text>
<rect x="130" y="270" width="400" height="60" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="330.0" y="298.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">class body runs</text>
<text x="330.0" y="315.0" font-size="11.5" fill="#555555" text-anchor="middle">defines book in the namespace</text>
<rect x="130" y="390" width="400" height="75" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="330.0" y="418.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">type.__new__</text>
<text x="330.0" y="435.0" font-size="11.5" fill="#555555" text-anchor="middle">creates the class object, then calls</text>
<text x="330.0" y="450.0" font-size="11.5" fill="#555555" text-anchor="middle">__set_name__ and __init_subclass__</text>
<rect x="130" y="525" width="400" height="60" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="330.0" y="553.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">__set_name__</text>
<text x="330.0" y="570.0" font-size="11.5" fill="#555555" text-anchor="middle">only if an attribute defines it: it learns its name</text>
<rect x="130" y="645" width="400" height="105" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="330.0" y="680.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">CarrierBase.__init_subclass__</text>
<text x="330.0" y="697.5" font-size="11.5" fill="#555555" text-anchor="middle">inspect.isabstract: abstract takes no code, is not registered</text>
<text x="330.0" y="712.5" font-size="11.5" fill="#555555" text-anchor="middle">concrete: needs a code</text>
<text x="330.0" y="727.5" font-size="11.5" fill="#555555" text-anchor="middle">duplicate code: raises DuplicateCarrierError</text>
<rect x="130" y="810" width="400" height="60" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="330.0" y="838.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">class decorators</text>
<text x="330.0" y="855.0" font-size="11.5" fill="#555555" text-anchor="middle">only if the class has any: they wrap it</text>
<rect x="650" y="660" width="300" height="75" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="800.0" y="688.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">registry</text>
<text x="800.0" y="705.0" font-size="11.5" fill="#555555" text-anchor="middle">CarrierBase.registry</text>
<text x="800.0" y="720.0" font-size="11.5" fill="#555555" text-anchor="middle">read-only view: FASTLINE, AIRCO</text>
<rect x="130" y="925" width="400" height="105" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="330.0" y="953.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">a metaclass comparison</text>
<text x="330.0" y="970.0" font-size="11.5" fill="#555555" text-anchor="middle">the same rules in the metaclass __new__</text>
<text x="330.0" y="985.0" font-size="11.5" fill="#555555" text-anchor="middle">its own registry</text>
<text x="330.0" y="1000.0" font-size="11.5" fill="#555555" text-anchor="middle">can conflict with another metaclass</text>
<text x="330.0" y="1015.0" font-size="11.5" fill="#555555" text-anchor="middle">mypy skips its class keywords</text>
<path d="M330,90 L330,150" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M330,210 L330,270" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M330,330 L330,390" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M330,465 L330,525" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M330,585 L330,645" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M330,750 L330,810" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M530,697 L650,697" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="596.0" y="689.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">if concrete</text>
<text x="596.0" y="689.0" font-size="11" fill="#555" text-anchor="middle">if concrete</text>
</svg>