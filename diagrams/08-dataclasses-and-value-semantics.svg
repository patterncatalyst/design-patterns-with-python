<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 560" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="290" y="30" width="560" height="56" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="570.0" y="56.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">@dataclass(frozen=True, slots=True, order=True)</text>
<text x="570.0" y="73.0" font-size="11.5" fill="#555555" text-anchor="middle">class SlotId: bay, row, tier</text>
<rect x="290" y="330" width="560" height="56" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="570.0" y="356.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Value Object force</text>
<text x="570.0" y="373.0" font-size="11.5" fill="#555555" text-anchor="middle">compared by content, safe to share, usable as a key</text>
<rect x="290" y="440" width="560" height="90" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="570.0" y="468.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Left to you</text>
<text x="570.0" y="485.0" font-size="11.5" fill="#555555" text-anchor="middle">the invariant in __post_init__</text>
<text x="570.0" y="500.0" font-size="11.5" fill="#555555" text-anchor="middle">immutable field types</text>
<text x="570.0" y="515.0" font-size="11.5" fill="#555555" text-anchor="middle">value or entity</text>
<rect x="20" y="180" width="170" height="56" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="105.0" y="206.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">__init__</text>
<text x="105.0" y="223.0" font-size="11.5" fill="#555555" text-anchor="middle">the constructor</text>
<rect x="206" y="180" width="170" height="56" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="291.0" y="206.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">__repr__</text>
<text x="291.0" y="223.0" font-size="11.5" fill="#555555" text-anchor="middle">readable text</text>
<rect x="392" y="180" width="170" height="56" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="477.0" y="206.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">__eq__ and __hash__</text>
<text x="477.0" y="223.0" font-size="11.5" fill="#555555" text-anchor="middle">compare by content</text>
<rect x="578" y="180" width="170" height="56" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="663.0" y="206.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">__lt__ to __ge__</text>
<text x="663.0" y="223.0" font-size="11.5" fill="#555555" text-anchor="middle">from order=True</text>
<rect x="764" y="180" width="170" height="56" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="849.0" y="206.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">__setattr__</text>
<text x="849.0" y="223.0" font-size="11.5" fill="#555555" text-anchor="middle">FrozenInstanceError</text>
<rect x="950" y="180" width="170" height="56" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="1035.0" y="206.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">__slots__</text>
<text x="1035.0" y="223.0" font-size="11.5" fill="#555555" text-anchor="middle">no per-instance dict</text>
