# Diagram gallery, in file order. Each entry pairs a diagrams/<name>.svg with
# its editable diagrams/<name>.excalidraw source. Entries use the keys
# name, section, title and caption. The gallery fills in as chapters land.

- name: 00-prerequisites
  section: "Ch. 0"
  title: The local build-and-test loop
  caption: >-
    The local build-and-test loop. One locked environment feeds lint, format,
    strict type checking and tests in order; a red step returns you to the
    source, and the prerequisites script gates the toolchain first.

- name: 01-patterns-as-decisions-under-forces
  section: "Ch. 1"
  title: The rate-quote decision under four forces
  caption: >-
    The rate-quote decision under four forces. Carrier tariffs, commercial
    surcharges and destination tax change on separate schedules while every
    quote must stay reproducible; the chosen shape follows from which force
    dominates.

- name: 02-what-1994-assumed-and-python-dissolves
  section: "Ch. 2"
  title: What the classic patterns assumed
  caption: >-
    Assumptions behind the classic patterns, each paired with the Python
    feature that removes it: functions as objects, structural typing,
    generators, modules imported once, and absence checked by the type checker.

- name: 03-the-three-way-split
  section: "Ch. 3"
  title: The three-way split
  caption: >-
    The three-way split. Two questions sort every catalogue pattern: does the
    name mean two things in Python, and does a language feature resolve the
    force without the pattern's structure? The answers place each pattern in
    dissolves, survives or needs disambiguating.

- name: 04-naming-patterns-for-teams-and-ai
  section: "Ch. 4"
  title: One pattern name, two readers
  caption: >-
    One pattern name, two readers. A reviewer and an AI assistant read the same
    name for the same contract; naming the Python mechanism as well, a callable
    type alias rather than a class hierarchy, keeps both readers on the
    idiomatic shape.

- name: 05-srp-ocp-lsp
  section: "Ch. 5"
  title: One quote, three responsibilities
  caption: >-
    One quote, three responsibilities. Pricing sits behind the RateCalculator
    Protocol and hands its net to tax rules keyed by destination country; the
    finished quote goes to an audit callable. Each changes for its own reason,
    and one contract suite checks every calculator.

- name: 06-isp-dip-and-di-without-a-framework
  section: "Ch. 6"
  title: Dependency injection without a framework
  caption: >-
    Dependency injection without a framework. The composition root builds one
    carrier adapter and passes it to each consumer, which names only the small
    Protocol it needs; the adapter satisfies both Protocols structurally and
    imports neither.

- name: 07-the-data-model
  section: "Ch. 7"
  title: How Python evaluates factor times price
  caption: >-
    How Python evaluates factor times price. The interpreter asks the left
    operand's type first; Decimal returns NotImplemented for Money, so Money's
    reflected method answers, and only when both decline does the expression
    raise TypeError.

- name: 08-dataclasses-and-value-semantics
  section: "Ch. 8"
  title: One declaration, the Value Object's structure
  caption: >-
    One declaration, the Value Object's structure. A frozen, slotted, ordered
    dataclass writes the constructor, repr, equality, hash, ordering and the
    assignment guard for SlotId; the invariant, immutable field types and the
    value-or-entity choice stay with you.

- name: 09-protocol-and-structural-typing
  section: "Ch. 9"
  title: Three checks behind one booking call
  caption: >-
    Three checks behind one booking call. The optional return makes absence a
    branch to narrow, the CarrierGateway Protocol is compared where a gateway
    is passed, and the CarrierBase ABC is checked at construction.

- name: 10-context-managers
  section: "Ch. 10"
  title: Both ways out of a manifest write
  caption: >-
    Both ways out of a manifest write. After __enter__ opens path.partial, the
    body writes lines; __exit__ then replaces the partial with path on success,
    or unlinks it and lets the exception propagate.

- name: 11-testing-with-pytest-pytest-mock-and-mypy
  section: "Ch. 11"
  title: How a claim becomes evidence
  caption: >-
    How a claim becomes evidence. A claim gets a witness test named after it,
    a negative fixture shows the failure it rules out, the test is seen failing
    when its check is deleted, and only a fresh, scrubbed run is quoted.

- name: 12-strategy-the-callable
  section: "Ch. 12"
  title: One quote, three rules in a slot
  caption: >-
    One quote, three rules in a slot. The caller names a rule, the read-only
    RATE_RULES registry returns a callable, and quote records the name with
    the price, whether the rule is a function, a partial or a frozen dataclass.

- name: 13-template-method-and-the-function-alternative
  section: "Ch. 13"
  title: One customs skeleton, two ways to vary it
  caption: >-
    One customs skeleton, two ways to vary it. declare_customs fixes the order
    and the invariant steps and takes hooks for the rest; CustomsDeclarer keeps
    the same skeleton final and lets a family of destinations share its schedule.

- name: 14-state-and-finite-state-machines
  section: "Ch. 14"
  title: One consignment lifecycle, two ways to write it
  caption: >-
    One consignment lifecycle, two ways to write it. A read-only table maps
    a status and an event to the next status; a match over frozen states
    does the same with per-state data, and any other pair is refused. An
    injected generator drives transit delays.

- name: 15-command-undo-and-command-queues
  section: "Ch. 15"
  title: Amendments as values on two stacks
  caption: >-
    Amendments as values on two stacks. Queued amendments are applied first
    in, first out, all or nothing; each application returns a new frozen
    request and the inverse it computed, which undo and redo move between
    the two stacks.

- name: 16-factory-method-and-abstract-factory
  section: "Ch. 16"
  title: Factories as values
  caption: >-
    Factories as values. A read-only registry maps a carrier code to one kit
    per family. The reference type ties the gateway to the label printer,
    while the rate source stays consistent only because the whole kit is
    chosen once.

- name: 17-builder-dataclasses-and-prototype
  section: "Ch. 17"
  title: Building and copying a booking request
  caption: >-
    Building and copying a booking request. A template is copied into a
    frozen keyword-only request whose checks rerun on every replace, and
    only an immutable field type keeps two copies from sharing one list.

- name: 18-singleton-module-borg-metaclass
  section: "Ch. 18"
  title: Four ways to load the tariff table once
  caption: >-
    Four ways to load the tariff table once, in the order to reach for them.
    A module, a lazy import and a parameter come first; the class forms
    beside them each cost something the tests measure.

- name: 19-adapter-facade-bridge
  section: "Ch. 19"
  title: One call, two axes, one translation
  caption: >-
    One call, two axes, one translation. The facade picks a gateway and a
    booking kind; each kind works through the narrow gateway Protocol, which
    one client already satisfies and the other reaches through an adapter
    that converts units.

- name: 20-decorator-pattern-vs-decorator-syntax-and-proxy
  section: "Ch. 20"
  title: Two things called Decorator, and a proxy
  caption: >-
    Two things called Decorator, and a proxy. Layers are chosen per
    consignment and stacked as a value while the program runs; the @ form
    rebinds a name once at definition; the proxy keeps the interface and
    controls access.

- name: 21-composite-and-flyweight
  section: "Ch. 21"
  title: One weight question, one shared commodity
  caption: >-
    One weight question, one shared commodity. A consolidation answers weight
    as a consignment does, summing its parts through nested groups; consignments
    reach a single frozen commodity per code from a pool that lets go of
    commodities nobody holds.

- name: 22-observer
  section: "Ch. 22"
  title: What a signal decides
  caption: >-
    What a signal decides. Each event reaches a snapshot of subscribers in
    order, nested events wait their turn, failures are gathered and raised
    afterwards, and bound methods are held weakly so abandoned subscribers
    can go.

- name: 23-mediator-and-chain-of-responsibility
  section: "Ch. 23"
  title: A chain of stages, then a mediator
  caption: >-
    A declaration passes along an ordered tuple of clearance stages; the first
    stage that decides ends the walk, and a clean one is released by the final
    stage. A separate mediator releases a declaration after the reports it is
    owed arrive.

- name: 24-iterator-generators-and-the-iterator-protocol
  section: "Ch. 24"
  title: A fresh iterator, lazy pages, a reader that closes
  caption: >-
    A tracking history gives each loop a fresh iterator, so two walks both see
    every event. Pages are read one batch at a time, and closing a reader
    closes its file.

- name: 25-visitor-memento-interpreter
  section: "Ch. 25"
  title: A match per operation, a snapshot, a tariff tree
  caption: >-
    Each operation over the closed event union is one match, and mypy reports
    a kind it leaves out. A booking rolls back from a frozen snapshot that
    leaves the audit alone, and one tariff tree is both priced and explained.

- name: 26-decorators-done-right
  section: "Ch. 26"
  title: Stack order, wraps, and a class decorator
  caption: >-
    The order of a stack decides whether a timer sees a cache hit.
    functools.wraps keeps a renderer's identity for runtime tools, ParamSpec
    keeps its signature for mypy, and a class decorator belongs above a slotted
    dataclass.

- name: 27-descriptors-and-properties
  section: "Ch. 27"
  title: One descriptor, a lookup order, a cached property
  caption: >-
    One Positive descriptor validates six fields in three classes. A lookup
    tries data descriptors, then the instance dictionary, then non-data
    descriptors, so a cached property is read from the dictionary after its
    first computation.

- name: 28-singledispatch
  section: "Ch. 28"
  title: Most specific class, another module, a method
  caption: >-
    tariff_code picks the most specific registered class and falls back to a
    function that raises. A registration made in another module exists only
    after that module is imported, and a method dispatches on the argument
    after self.

- name: 29-metaclasses-init-subclass-and-registries
  section: "Ch. 29"
  title: Class creation, one hook, a read-only registry
  caption: >-
    Creating a carrier class runs __set_name__ and then __init_subclass__, which
    refuses a bad class and registers a concrete one in a read-only view. A
    metaclass can enforce the same rules, but it can conflict with another
    library's metaclass.

- name: 30-dynamic-attributes-and-proxy
  section: "Ch. 30"
  title: A failed lookup, one load, a refused name
  caption: >-
    A read that ordinary lookup can't answer reaches __getattr__, which loads
    the declared fields once into the instance dictionary and refuses any other
    name. Later reads skip it, and a class that relies on forwarding fails
    iter() and len().

- name: 31-shortcut-patterns-dict-dispatch-and-eafp
  section: "Ch. 31"
  title: A table lookup in the try, a rate read that asks forgiveness
  caption: >-
    Issuing a document looks the kind up in a read-only table and calls the
    issuer outside the try. Reading a duty rate asks forgiveness, so an eviction
    by another thread reloads the rate instead of raising KeyError.

- name: 32-anti-patterns-and-pattern-misuse
  section: "Ch. 32"
  title: One function against a factory, a strategy and a visitor
  caption: >-
    The same quote from one function and from a factory, strategy and visitor.
    They pass the same table and the same type check, but the engine spreads the
    fuel surcharge across five definitions where the function holds it in one.

- name: 33-seams-in-python
  section: "Ch. 33"
  title: Where a patch lands, and where it misses
  caption: >-
    A patch replaces a name where the engine looks it up. The
    legacy module holds its own name for the FASTLINE call, so patching the
    carrier's module misses it, and so does patching the margin constant after
    the class is defined.

- name: 34-dependency-breaking-techniques
  section: "Ch. 34"
  title: Four steps under one characterisation table
  caption: >-
    Each step moves the enabling point from a patched name toward a
    parameter mypy checks, and one characterisation table runs at every step.
    Subclass and override passes it too, but a misspelt method reaches the real
    carrier.

- name: 35-fowler-vs-feathers
  section: "Ch. 35"
  title: Two rounding refactors under intent rows and golden quotes
  caption: >-
    The same two rounding refactors under two kinds of test. Rows written from
    the requirement pass both, while golden quotes recorded from the legacy
    engine list the rows each refactor changed.

- name: 36-refactor-or-rewrite
  section: "Ch. 36"
  title: A router between the legacy engine and its rewrite
  caption: >-
    A router serves migrated zones from the rewrite and the rest from the legacy
    engine, and can run the rewrite in shadow. A parity table holds the two to the
    same quotes, and a first draft with exclusive band limits fails it.

- name: 37-the-gil-and-performance
  section: "Ch. 37"
  title: Two threads reserving a slot with and without a lock
  caption: >-
    Two threads reserving a slot on one sailing. Parked between reading and
    writing, they take the same slot on either build; a lock that covers the
    read and the write gives each its own.

- name: 38-asyncio-and-the-patterns
  section: "Ch. 38"
  title: A carrier session, a feed, subscribers, quotes and commands
  caption: >-
    A carrier session closes its feed when its body ends, subscribers run under
    gather, quotes run in a task group and commands drain from a queue. An await
    is a point where another task can run, and cancellation still closes the
    feed.

- name: 39-final-project
  section: "Ch. 39"
  title: One booking through the desk, with undo callbacks on an exit stack
  caption: >-
    One booking through the desk's steps. A completed step registers its undo on
    an exit stack, a held declaration unwinds them in reverse, and the tracking
    event is published after the commit.

- name: 40-working-with-ai-and-llm-tools
  section: "Ch. 40"
  title: A draft, three gates and the findings that go back
  caption: >-
    A draft is checked by three gates: types and lint, the pattern shape rules
    and a behaviour oracle. The three drafts are reported by different gates, and
    the findings on a rejected reply go back in the next prompt.
