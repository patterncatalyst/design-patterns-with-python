# Diagram gallery, in file order. Each entry pairs a diagrams/<name>.svg with
# its editable diagrams/<name>.excalidraw source. Entries use the keys
# name, section, title and caption. The gallery fills in as chapters land.

- name: 00-prerequisites
  section: "Ch. 0"
  title: The local build-and-test loop
  caption: >-
    The local build-and-test loop. One locked environment feeds lint, format,
    strict type checking and tests in order; a red step returns you to the
    source, and the prerequisites script gates the toolchain first.

- name: 01-patterns-as-decisions-under-forces
  section: "Ch. 1"
  title: The rate-quote decision under four forces
  caption: >-
    The rate-quote decision under four forces. Carrier tariffs, commercial
    surcharges and destination tax change on separate schedules while every
    quote must stay reproducible; the chosen shape follows from which force
    dominates.

- name: 02-what-1994-assumed-and-python-dissolves
  section: "Ch. 2"
  title: What the classic patterns assumed
  caption: >-
    Assumptions behind the classic patterns, each paired with the Python
    feature that removes it: functions as objects, structural typing,
    generators, modules imported once, and absence checked by the type checker.

- name: 03-the-three-way-split
  section: "Ch. 3"
  title: The three-way split
  caption: >-
    The three-way split. Two questions sort every catalogue pattern: does the
    name mean two things in Python, and does a language feature resolve the
    force without the pattern's structure? The answers place each pattern in
    dissolves, survives or needs disambiguating.

- name: 04-naming-patterns-for-teams-and-ai
  section: "Ch. 4"
  title: One pattern name, two readers
  caption: >-
    One pattern name, two readers. A reviewer and an AI assistant read the same
    name for the same contract; naming the Python mechanism as well, a callable
    type alias rather than a class hierarchy, keeps both readers on the
    idiomatic shape.

- name: 05-srp-ocp-lsp
  section: "Ch. 5"
  title: One quote, three responsibilities
  caption: >-
    One quote, three responsibilities. Pricing sits behind the RateCalculator
    Protocol and hands its net to tax rules keyed by destination country; the
    finished quote goes to an audit callable. Each changes for its own reason,
    and one contract suite checks every calculator.

- name: 06-isp-dip-and-di-without-a-framework
  section: "Ch. 6"
  title: Dependency injection without a framework
  caption: >-
    Dependency injection without a framework. The composition root builds one
    carrier adapter and passes it to each consumer, which names only the small
    Protocol it needs; the adapter satisfies both Protocols structurally and
    imports neither.

- name: 07-the-data-model
  section: "Ch. 7"
  title: How Python evaluates factor times price
  caption: >-
    How Python evaluates factor times price. The interpreter asks the left
    operand's type first; Decimal returns NotImplemented for Money, so Money's
    reflected method answers, and only when both decline does the expression
    raise TypeError.

- name: 08-dataclasses-and-value-semantics
  section: "Ch. 8"
  title: One declaration, the Value Object's structure
  caption: >-
    One declaration, the Value Object's structure. A frozen, slotted, ordered
    dataclass writes the constructor, repr, equality, hash, ordering and the
    assignment guard for SlotId; the invariant, immutable field types and the
    value-or-entity choice stay with you.

- name: 09-protocol-and-structural-typing
  section: "Ch. 9"
  title: Three checks behind one booking call
  caption: >-
    Three checks behind one booking call. The optional return makes absence a
    branch to narrow, the CarrierGateway Protocol is compared where a gateway
    is passed, and the CarrierBase ABC is checked at construction.

- name: 10-context-managers
  section: "Ch. 10"
  title: Both ways out of a manifest write
  caption: >-
    Both ways out of a manifest write. After __enter__ opens path.partial, the
    body writes lines; __exit__ then replaces the partial with path on success,
    or unlinks it and lets the exception propagate.

- name: 11-testing-with-pytest-pytest-mock-and-mypy
  section: "Ch. 11"
  title: How a claim becomes evidence
  caption: >-
    How a claim becomes evidence. A claim gets a witness test named after it,
    a negative fixture shows the failure it rules out, the test is seen failing
    when its check is deleted, and only a fresh, scrubbed run is quoted.

- name: 12-strategy-the-callable
  section: "Ch. 12"
  title: One quote, three rules in a slot
  caption: >-
    One quote, three rules in a slot. The caller names a rule, the read-only
    RATE_RULES registry returns a callable, and quote records the name with
    the price, whether the rule is a function, a partial or a frozen dataclass.

- name: 13-template-method-and-the-function-alternative
  section: "Ch. 13"
  title: One customs skeleton, two ways to vary it
  caption: >-
    One customs skeleton, two ways to vary it. declare_customs fixes the order
    and the invariant steps and takes hooks for the rest; CustomsDeclarer keeps
    the same skeleton final and lets a family of destinations share its schedule.

- name: 14-state-and-finite-state-machines
  section: "Ch. 14"
  title: One consignment lifecycle, two ways to write it
  caption: >-
    One consignment lifecycle, two ways to write it. A read-only table maps
    a status and an event to the next status; a match over frozen states
    does the same with per-state data, and an injected generator drives
    transit delays.

- name: 15-command-undo-and-command-queues
  section: "Ch. 15"
  title: Amendments as values on two stacks
  caption: >-
    Amendments as values on two stacks. Queued amendments are applied first
    in, first out, all or nothing; each application returns a new frozen
    request and the inverse it computed, which undo and redo move between
    the two stacks.

- name: 16-factory-method-and-abstract-factory
  section: "Ch. 16"
  title: Factories as values
  caption: >-
    Factories as values. A read-only registry maps a carrier code to one kit
    per family. The reference type ties the gateway to the label printer,
    while the rate source stays consistent only because the whole kit is
    chosen once.

- name: 17-builder-dataclasses-and-prototype
  section: "Ch. 17"
  title: Building and copying a booking request
  caption: >-
    Building and copying a booking request. A template is copied into a
    frozen keyword-only request whose checks run on every copy path, and
    only an immutable field type keeps two copies from sharing one list.

- name: 18-singleton-module-borg-metaclass
  section: "Ch. 18"
  title: Four ways to load the tariff table once
  caption: >-
    Four ways to load the tariff table once, in the order to reach for them.
    A module, a lazy import and a parameter come first; the class forms
    beside them each cost something the tests measure.
